# Local development profile (active by default — no flag needed).
app:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:invoices-buckets}
      region: ${AWS_REGION:ap-southeast-1}
      upload-prefix: ${AWS_S3_UPLOAD_PREFIX:invoices-buckets/invoices/}

logging:
  level:
    com.example.invoiceplatform: DEBUG
    software.amazon.awssdk: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
